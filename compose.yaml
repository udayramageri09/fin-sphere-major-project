# Rehearsal template. Review host firewall, secrets, TLS and backups before use.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      IMPORT_LEGACY_JSON: 'false'
      ML_SERVICE_URL: http://analytics:8000
    ports:
      - '127.0.0.1:5000:5000'
    networks: [analytics, outbound]
    # Bound the API process. Measured on Windows/Node 24 with synthetic data (docs/RELEASE_VERIFICATION.md, addendum): about 290 MB peak
    # with the OCR queue saturated by 20-megapixel images, 94 MB for a 3,000-row analysis, back to about 77 MB when idle. 1 GiB leaves
    # roughly 3x headroom; an oversized spreadsheet that exceeds it is killed and restarted instead of taking the host down.
    # Container behaviour was NOT verified (Docker was unavailable): confirm the limit on the target host.
    mem_limit: 1024m
    depends_on:
      analytics:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
  analytics:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    networks: [analytics]
    mem_limit: 1536m
    cpus: 1.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
networks:
  analytics:
    internal: true
  outbound: {}
