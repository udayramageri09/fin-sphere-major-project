# Rehearsal template. Review host firewall, secrets, TLS and backups before use.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      IMPORT_LEGACY_JSON: 'false'
      ML_SERVICE_URL: http://analytics:8000
    ports:
      - '127.0.0.1:5000:5000'
    networks: [analytics, outbound]
    depends_on:
      analytics:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
  analytics:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    networks: [analytics]
    mem_limit: 1536m
    cpus: 1.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
networks:
  analytics:
    internal: true
  outbound: {}
